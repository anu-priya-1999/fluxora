name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fluxora_ci
      FLUXORA_QUEUE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fluxora_queue_ci
      FLUXORA_ALLOW_DESTRUCTIVE_QUEUE_MIGRATION_TESTS: "true"

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fluxora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d fluxora_ci"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate database
        run: pnpm db:migrate

      - name: Prepare isolated queue test database
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres -c "CREATE DATABASE fluxora_queue_ci;" || docker exec ${{ job.services.postgres.id }} psql -U postgres -d postgres -c "CREATE DATABASE fluxora_queue_ci;"

      - name: Lint
        run: pnpm lint

      - name: Evidence Lint
        run: pnpm lint:evidence

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build